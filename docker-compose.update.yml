# 一键更新的**可选叠加文件**（默认不启用）。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.update.yml up -d
#
# ⚠️ 安全面：挂上 /var/run/docker.sock 等于把**宿主机的 docker 控制权**交给容器。
# 应用内「立即更新」按钮会拉取最新镜像并重建自身容器（见 novelforge/core/updater.py）。
# 仅在信任部署环境、且希望用应用内按钮升级时才叠加本文件；不叠加则「立即更新」按钮
# 会降级为「显示复制升级命令」。
services:
  novel_dl_convert:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
