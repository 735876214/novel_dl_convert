name: Build and Push Image

# 在每次推送到 main 时，把「源码 + 依赖」烤进镜像并发布到 ghcr.io。
# NAS 端只需 docker compose up -d 即可拉取这个预构建镜像运行，无需本地 build、无需运行时 clone。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # ⚠️ 下面这 5 个 action 的大版本是**成组**挑的：都必须是 **node24** 运行时 ——
    # `checkout@v4` / `build-push@v6` / `setup-buildx@v3` / `setup-qemu@v3` / `login@v3` 那批是 node20，
    # GitHub 已弃用并强制在 node24 上跑（每次构建打一条 warning，第 105–113 期一直挂着）。
    # 升级任一个都要同批核 `inputs:` 无更名，并改 `tests/test_ci_actions_contract.py` 的 `ALLOWED`。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本号单一真值源：从仓库根 VERSION 文件读取，注入镜像 LABEL（见 Dockerfile 的 APP_VERSION）
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # 多架构：x86 NAS 与 ARM NAS（群晖部分机型 / 树莓派）都能直接 pull
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 多阶段构建 + GHA 层缓存：源码没变时依赖层直接命中缓存，二次构建显著提速
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false # 关掉来源证明清单，避免老版本 Docker / 群晖套件拉多架构镜像时解析异常
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          # 第 109 期（v1.0.0）起多推一个**版本 tag**：NAS 端可 `image: …:1.0.0` 固定住版本、
          # 需要时回滚到上一个版本；`latest` 仍是「最新一次 main 的构建」。
          tags: |
            ghcr.io/735876214/novel_dl_convert:latest
            ghcr.io/735876214/novel_dl_convert:${{ steps.version.outputs.version }}
            ghcr.io/735876214/novel_dl_convert:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 公开镜像，确保 NAS 匿名即可 pull
      - name: Ensure package is public
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/novel_dl_convert/visibility \
            -d '{"visibility":"public"}'
