name: Build and Push Image

# 在每次推送到 main 时，把「源码 + 依赖」烤进镜像并发布到 ghcr.io。
# NAS 端只需 docker compose up -d 即可拉取这个预构建镜像运行，无需本地 build、无需运行时 clone。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# ⚠️ 第 145 期：同一个 ref 只保留最近一次构建。
# 两次构建同时往同一份 GHA 层缓存（`type=gha`）里写，会撞上
# `ERROR: error writing layer blob: not_found` —— 历史上 2026-09/10 那批「Build and Push Image」
# 红叉里有相当一部分是这个，而不是源码有问题（源码问题另有其因，见第 105 期）。
# `cancel-in-progress: true`：连推两笔时旧的那次直接取消，不留下一个失败/取消的噪音 run。
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 多架构 + apt + npm + pip 全量，实测 12–20 分钟；超时宁可红在「太慢」上，也不要挂 6 小时
    timeout-minutes: 45
    # ⚠️ 下面这 5 个 action 的大版本是**成组**挑的：都必须是 **node24** 运行时 ——
    # `checkout@v4` / `build-push@v6` / `setup-buildx@v3` / `setup-qemu@v3` / `login@v3` 那批是 node20，
    # GitHub 已弃用并强制在 node24 上跑（每次构建打一条 warning，第 105–113 期一直挂着）。
    # 升级任一个都要同批核 `inputs:` 无更名，并改 `tests/test_ci_actions_contract.py` 的 `ALLOWED`。
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 第 150 期：要判断「这次提交有没有改 VERSION」，得能看到上一提交
          fetch-depth: 2

      # 版本号单一真值源：从仓库根 VERSION 文件读取，注入镜像 LABEL（见 Dockerfile 的 APP_VERSION）
      - name: Read version
        id: version
        # ⚠️ 第 150 期：必须去掉 `\r`。`$(cat VERSION)` 只吃掉行尾 `\n`，CRLF 文件会把 `\r`
        # 留在版本号里，于是镜像 tag 变成 `1.4.1<CR>`，`docker buildx imagetools` 报
        # `ERROR: invalid reference format`（实测踩过）；`build-args` 也会带上这个脏字节。
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      # 多架构：x86 NAS 与 ARM NAS（群晖部分机型 / 树莓派）都能直接 pull
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 多阶段构建 + GHA 层缓存：源码没变时依赖层直接命中缓存，二次构建显著提速
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false # 关掉来源证明清单，避免老版本 Docker / 群晖套件拉多架构镜像时解析异常
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          # ⚠️ 第 150 期：这里**不再**直接推 `:<VERSION>`。它原来每推一次 main 就覆盖一次，
          # 于是同一个 `1.4.0` 先后指过第 147 / 148 / 149 三种内容的构建 ——
          # 「钉住版本号」反而失效（`pull :1.4.0` 拿到的不一定是当初发的那一版）。
          # 现在三条 tag 各司其职：
          #   `latest`    = 最新一次 main 的构建（会漂，用于「我要最新」）
          #   `:<sha>`    = 这一笔提交的构建（**不可变**，任何时候都能精确指回来）
          #   `:<VERSION>`= 只在**版本号变化**时指向本次构建（见下面「版本变了 ⇒ 打 :VERSION」）
          tags: |
            ghcr.io/735876214/novel_dl_convert:latest
            ghcr.io/735876214/novel_dl_convert:${{ github.sha }}
          cache-from: type=gha
          # `ignore-error=true`：缓存**导出**失败（GHA 缓存配额 / 竞态 / 网络）只记一条 warning，
          # 不把整个构建判红 —— 缓存是加速手段，不是交付物。第 145 期加。
          cache-to: type=gha,mode=max,ignore-error=true

      # 第 150 期：`VERSION` 与上一提交比 —— 变了才说明「这是一次发布」。
      - name: 版本号变了吗
        id: verchg
        run: |
          if ! git rev-parse -q --verify HEAD^ >/dev/null; then
            echo "changed=1" >> "$GITHUB_OUTPUT"          # 首个提交，按变了处理
          elif git diff --quiet HEAD^ HEAD -- VERSION; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      # 只在版本号变化时改 `:<VERSION>` 的指向 —— 用 imagetools **只改 tag、不重建**
      # （省一整个多架构构建）。版本号没变 ⇒ `:<VERSION>` 保持上一次发布的内容不变，
      # 这正是「钉住版本」该有的语义。
      - name: 版本变了 ⇒ 把 `:<VERSION>` 指向本次构建
        if: steps.verchg.outputs.changed == '1'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/735876214/novel_dl_convert:${{ steps.version.outputs.version }} \
            ghcr.io/735876214/novel_dl_convert:${{ github.sha }}

      # 公开镜像，确保 NAS 匿名即可 pull。
      #
      # ⚠️ 第 152 期：这一步此前是 `curl -fsSL -X PUT …` + `continue-on-error: true`。
      # 它**不会让构建失败**，但 curl 的 `-f` 会把 4xx 变成非 0 退出，于是 run 页长期挂着
      # 一条「Process completed with exit code 22」—— 看起来像构建挂了（第 114 期的记录里
      # 也把它列为「不是失败」的噪音）。而且 `GITHUB_TOKEN` 并不是这个**用户所有**包的
      # 管理员，那个 PUT 在 CI 里注定 403。
      #
      # 现在的口径（任何一条路都**不以非 0 退出**）：
      #   ① 先 GET 读现状：已经 public 就跳过（幂等，也不发无意义的写请求）；
      #   ② 读到了、且确实不是 public，才尝试 PUT；失败发 `::warning::` 并说明去 Packages 页手动改；
      #   ③ 读不到（token 权限不足等）发 `::notice::` —— 这不是构建失败，只是「核对不了」。
      - name: Ensure package is public
        if: github.event_name == 'push'
        run: |
          set -u
          api="https://api.github.com"
          auth="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          accept="Accept: application/vnd.github+json"
          pkg="$api/user/packages/container/novel_dl_convert"

          read_vis() {
            # 只读：打印 visibility 字段；读不到打印空串（**不**用 curl -f，见上）
            python3 -c "import json;print(json.load(open('pkg.json')).get('visibility',''))" 2>/dev/null || true
          }

          code=$(curl -sS -o pkg.json -w '%{http_code}' -H "$auth" -H "$accept" "$pkg" || echo 000)
          vis=""
          if [ "$code" = "200" ]; then vis=$(read_vis); fi

          if [ "$vis" = "public" ]; then
            echo "镜像可见性已是 public，跳过。"
            exit 0
          fi

          if [ "$code" != "200" ]; then
            echo "::notice::无法通过 API 核对镜像可见性（HTTP $code）——GITHUB_TOKEN 不是该用户包的管理员。镜像此前已公开可匿名 pull；如不确定，请在 GitHub 的 Packages 页面确认一次。"
            exit 0
          fi

          code=$(curl -sS -o put.json -w '%{http_code}' -X PUT -H "$auth" -H "$accept" \
            "$pkg/visibility" -d '{"visibility":"public"}' || echo 000)
          case "$code" in
            2*) echo "镜像已设为 public。" ;;
            *)  echo "::warning::无法通过 API 把镜像设为 public（HTTP $code）——请在 GitHub 的 Packages 页面手动确认一次。响应：$(head -c 300 put.json 2>/dev/null || true)" ;;
          esac
          exit 0
