name: Tests

# 后端全量 pytest 的 CI 门（第 118 期）。
#
# 为什么非有这一步：在这之前 pytest **只在开发机（Windows）上跑过** —— CI 里只有
# `Build and Push Image`（只做 `docker build`）和 `Release`（只打 tag）。于是「代码假设
# 了 Windows」这类缺陷无人发现，攒到第 118 期一次抓出两条真红：
#   ① `.github` 之外无人在 Linux 跑 ⇒ 没人发现 `tests/conftest.py` 的仓库根守卫
#      不认 `dir_fd`，POSIX 上 `shutil.rmtree` 删子项时把**裸文件名**按 cwd(=仓库根)
#      解析，12 例数据安全用例（覆盖前留档 / FB2 重建 / 音频中途失败）必红；
#   ② `scripts/test.sh` 里 `"$PY）"` 在 macOS 自带 bash 3.2 下把全角括号吞进变量名
#      ⇒ `set -u` 报 `PY: unbound variable`，**一条测试都没跑**就 exit 1。
#
# 入口用 `bash scripts/test.sh` 而不是裸 `pytest`：清 proxy 变量、junit 判定成败这些口径
# 只该有**一处**实现（`AGENTS.md` §1「单一真值源」），CI 与本地走同一条路才不会分叉。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ⚠️ 第 145 期：同一个 ref 只保留最近一次测试。
# 连推两笔时，旧的那次会被取消（`cancel-in-progress: true`）—— 它的结论对最新代码没有意义，
# 而历史页面上留一堆 cancelled/failed 的噪音会掩盖真红。
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ⚠️ 3.12 而不是最新的 3.13：`quickjs` 只有 cp38–cp312 的预编译包
      #    （见 `requirements.txt` 的 `python_version < "3.13"` 标记与 `AGENTS.md` §5），
      #    在 3.13 上装整条依赖会失败。要升 Python 得先解决这个包。
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # 全量离线（`AGENTS.md` §4）。失败时脚本以非 0 退出，job 直接红；
      # 收尾会打印 junit 路径与「X passed / Y failed / Z skipped」的汇总行。
      - name: Run pytest
        run: bash scripts/test.sh

  # ⚠️ 第 247 期：前端的质量门此前**完全缺失** ——
  #   · `docker build` 只跑 `npm run build`（= `vite build`），而 **vite 不做类型检查**
  #     （esbuild/rolldown 只转译）⇒ **TS 类型错误不会被镜像构建抓到**；
  #   · `tests.yml` 只有 pytest 一个 job ⇒ **vitest 的单测失败 CI 也抓不到**。
  # 而本仓记忆里明写「`vue-tsc` 与 `vitest` 各有对方没有的判据力」——
  # 缺了这两个门，等于**没有守门人**。
  #
  # 为什么只跑这两步（不跑 build / deploy）：
  #   · `build` 已由 `docker-image.yml` 的镜像构建覆盖（它跑的就是 `npm run build`）；
  #   · `deploy` 把产物同步进 `novelforge/static/v2/` —— 那个目录**已 gitignore**，
  #     CI 里同步它纯属污染工作区。
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ⚠️ 24.x 与本机一致（`AGENTS.md` §4：Node 走 nvm 24.x）。
      # `npm ci` 用 `package-lock.json`（锁文件）⇒ 与本机装的是同一套依赖。
      # ⚠️ `setup-node` **必须用 v6**：v4 是 node20 运行时（GHA 会告警并强制跑 node24），
      # v5 起才是 node24 —— 已抓上游 `v6/action.yml` 核过 `runs.using: node24`，
      # `inputs:`（node-version / cache / cache-dependency-path）与 v4 逐字相同。
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 类型检查（`vue-tsc --build`）：抓**只有它能抓**的那一类（组件 props / 导入的类型不匹配）。
      - name: Type check
        run: npm run type-check

      # 单测（`vitest run`）：抓**只有它能抓**的那一类（真 mount 才暴露的问题，
      # 例如缺 `</div>` —— `vue-tsc` 对它 exit 0）。
      - name: Unit tests
        run: npm run test:unit
