# 发布：推送 v* tag 时自动创建 GitHub Release，notes 取 CHANGELOG.md 对应版本段。
# 版本约定：第 N 期 = V0.N.0（见 VERSION 文件）。打 tag 即发布：
#   git tag v0.78.0 && git push origin v0.78.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抽取 CHANGELOG 对应版本段
        id: notes
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          tag = "${{ github.ref_name }}".lstrip("vV")
          pat = re.compile(r"^## (V[\d.]+)\b", re.M)
          m = next((mm for mm in pat.finditer(text) if mm.group(1).lstrip("Vv") == tag), None)
          if not m:
              sys.exit(f"CHANGELOG.md 未找到对应版本段：{tag}")
          start = m.end()
          nxt = pat.search(text, start)
          end = nxt.start() if nxt else len(text)
          pathlib.Path("NOTES.md").write_text(text[start:end].strip() + "\n", encoding="utf-8")
          PY

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" -F NOTES.md -t "${{ github.ref_name }}"
