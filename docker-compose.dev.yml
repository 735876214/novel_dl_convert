# NovelForge — 本地开发用 Compose（对比 docker-compose.yml 用）
#
# 与 docker-compose.yml 的区别：
#   docker-compose.yml     拉 ghcr.io 预构建镜像，源码 + 依赖全烤在镜像里 → NAS 部署用
#   docker-compose.dev.yml 本地 build 镜像，并把宿主机 novelforge/ 挂进容器覆盖镜像源码 → 本地开发用
#
# 挂载源码带来的好处：
#   - 改前端（index.html / style.css / app.js）→ StaticFiles 每次请求都从磁盘读，
#     只需刷新浏览器即可看到效果，不用重建镜像、不用重启容器
#   - 改 Python（server.py / core / sources）→ 执行 restart 重启容器即可
#
# 用法（在本文件所在目录执行）：
#   docker compose -f docker-compose.dev.yml up -d --build   # 首次构建 + 启动
#   docker compose -f docker-compose.dev.yml logs -f         # 跟踪日志
#   docker compose -f docker-compose.dev.yml restart         # 改完 Python 后重启
#   docker compose -f docker-compose.dev.yml down            # 停止并删除容器
#   docker compose -f docker-compose.dev.yml up -d --build   # 改过 requirements.txt / Dockerfile 后重建
#
# 访问：http://localhost:8993
# 说明：这里刻意用 8993（docker-compose.yml 用 8992），这样旧镜像容器和新代码可以同时跑、便于对比。

services:
  novelforge-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PY_VERSION: "3.12"
        NODE_VERSION: "22"
        # 本机网络对 deb.debian.org 不稳定（502）。这些依赖在 amd64 上都有现成 wheel，
        # 不装 build-essential 也能装成功，省掉最容易失败的一步。
        INSTALL_BUILD_TOOLS: "0"
        # 国内 PyPI 源，比 pypi.org 快很多
        PIP_INDEX: "https://pypi.tuna.tsinghua.edu.cn/simple"
    image: novelforge:dev
    container_name: novelforge-dev
    restart: unless-stopped
    working_dir: /app
    pull_policy: build          # 始终用本地构建，不去 registry 找 novelforge:dev
    ports:
      - "8993:8000"
    volumes:
      # 源码挂载：前端改动刷新浏览器即生效；Python 改完 restart 容器
      - ./novelforge:/app/novelforge
      # 仓库根目录的 config.yaml 直接映射到容器实际读取的路径（CONFIG_DIR/config.yaml）
      - ./config.yaml:/app/config/config.yaml:ro
      # 数据目录，与 NAS 部署保持一致
      - ./input:/app/input
      - ./output:/app/output
      - ./cookies:/app/config/cookies
      - ./cache:/app/config/cache
    environment:
      - TZ=Asia/Shanghai
      - INPUT_DIR=/app/input
      - OUTPUT_DIR=/app/output
      - CONFIG_DIR=/app/config
      - COOKIE_DIR=/app/config/cookies
      - CACHE_DIR=/app/config/cache
      - LOG_DIR=/app/config/logs
      # 本地调试想手动触发扫描时，可打开下面这行关掉自动监听
      # - AUTO_WATCH=false
      # 可选：AI 分章兜底（不填则不联网）
      # - LLM_API_KEY=
    command: ["sh", "/app/start.sh"]
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
