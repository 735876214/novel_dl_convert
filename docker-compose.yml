# NovelForge — NAS / 容器部署
# 目录职责严格分离：输入源文件、导出成品、配置/cookie/缓存各自独立挂载。
#
# ⚠️ 部署必读：
# 1. 必须在「本文件所在目录」(novel_dl_convert/) 内运行 docker compose，
#    不要在上一级目录用 -f 指向它——否则 build 上下文找不到 Dockerfile。
# 2. 该目录必须包含【完整内容】的 Dockerfile（不是空文件）。日志里若出现
#    "transferring dockerfile: 2B" / "open Dockerfile: no such file or directory"
#    即说明取到的 Dockerfile 为空或目录不对，请确认上传/同步完整。
# 3. 不写 image 字段，强制本地 build；避免某些平台带 --pull 时去 Docker Hub
#    拉取一个不存在的 novel_dl_convert 镜像而报 "pull access denied"。
services:
  novel_dl_convert:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novel_dl_convert
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # ① 输入目录：把待转换的 txt / 电子书源文件放这里（只读可选，转换不写回）
      - ./input:/app/input
      # ② 导出目录：生成的 epub 等成品写到这里（与输入物理隔离，互不污染）
      - ./output:/app/output
      # ③ 配置：config.yaml 只读挂载（改了需重启容器生效）
      - ./config.yaml:/app/config/config.yaml:ro
      # ④ Cookie 持久化：各书源登录态落盘，跨重启保留（下载功能用）
      - ./cookies:/app/config/cookies
      # ⑤ AI 分章缓存：按文本哈希缓存 LLM 结果，重复文件不二次计费
      - ./cache:/app/config/cache
    environment:
      - TZ=Asia/Shanghai
      - PUID=1000
      - PGID=1000
      - INPUT_DIR=/app/input
      - OUTPUT_DIR=/app/output
      - CONFIG_DIR=/app/config
      - COOKIE_DIR=/app/config/cookies
      - CACHE_DIR=/app/config/cache
      # 可选：AI 分章兜底（不填则不联网）
      # - LLM_API_KEY=
      # - LLM_BASE_URL=https://api.openai.com/v1
      # - LLM_MODEL=gpt-4o-mini
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
