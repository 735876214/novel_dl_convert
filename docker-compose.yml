# NovelForge — NAS / 容器部署（拉取预构建镜像，NAS 端不需要 build、不需要 clone 源码）
#
# 部署只要这一个文件（**不需要任何额外的 .env / 配置文件**）：
#   1) NAS 上建一个部署目录（如 /volume1/docker/novelforge），把本文件放进去
#   2) 按需修改下面标了「可改」的几处（端口 / 数据路径 / 登录密码）
#   3) docker compose up -d
#
# 访问：http://<NAS-IP>:8992
# 更新：docker compose pull && docker compose up -d
# 日志：docker compose logs -f
# 停止：docker compose down      （不会删挂载出来的数据目录）
# 群晖 Container Manager：新建「项目」→ 选择本目录 → 启动
#
# 镜像 ghcr.io/735876214/novel_dl_convert:latest 由 GitHub Actions 在每次推送 main 时
# 构建（linux/amd64 + linux/arm64 双架构），**源码与全部 Python 依赖已烤进镜像** ⇒
# 容器启动秒级，不需要本地 build，也不需要运行时 clone。
#
# 挂载出来的宿主机目录（相对路径＝部署目录下，首次启动自动创建，无需手动 mkdir）：
#   ./input     输入源文件（txt 自动转 EPUB）
#   ./output    导出成品
#   ./config    配置（config.yaml / settings.json / 书源 / 日志 / 备份 / 字体）
#   ./cookies   书源登录态（跨重启保留）
#   ./cache     AI 分章结果缓存
#   ./data      老的 SQLite（第 62 期起首次启动会整库搬进 PG，之后只读、不删）
#   ./pgdata    PostgreSQL 数据目录（第 62 期起业务数据的家，务必留在持久盘）
#   ./libraries 书库来源根：其下的子文件夹可被「新建书库」就地引用
#   要指到 NAS 上已有的共享目录，把这些相对路径改成绝对路径即可（如 /volume1/books）。
#
# ⚠️ 部署目录里不要放 docker-compose.override.yml：Compose 会**自动合并**它，在你不察觉的
#    情况下改掉端口与拉取策略。本仓库那份临时文件已改名 docker-compose.offline.yml，只有
#    显式 `-f` 才生效。

services:
  # ———— PostgreSQL（第 62 期）：书目索引 + 全部业务表的落库后端 ————
  #
  # 为什么要有它：SQLite 的文件锁把读也串行化了，而书库挂在 NAS 上时「书架一次要
  # 查 266 本书的元数据」这类批量读会互相排队。PG 把读写分开，也顺带给将来多实例
  # 留了余量（本项目的缓存层还会再叠一个 Redis，见第 62 期阶段 C）。
  #
  # 首次启动时，服务端会自动把老的 ./data/novelforge.db **整库搬进来**（幂等，
  # 只搬一次，原文件一个字节都不动），所以升级不需要手工操作 —— 见
  # novelforge/core/pgmigrate.py。
  postgres:
    image: postgres:16-alpine
    container_name: novelforge-pg
    restart: unless-stopped
    # 可改：口令。改这里的同时**必须**改下面 novel_dl_convert 的 NOVELFORGE_PG_DSN。
    # ⚠️ 只在**首次**启动（数据目录还是空的时候）生效：改口令要连 ./pgdata 一起重来。
    environment:
      - POSTGRES_USER=novelforge
      - POSTGRES_PASSWORD=novelforge
      - POSTGRES_DB=novelforge
      # 中文书名 / 作者名的排序与比较（PG 默认 C 排序对中文是「按字节」）
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8
      - TZ=Asia/Shanghai
    volumes:
      # 可改：PG 的数据目录。**务必留在持久盘上** —— 这里是升级后全部业务数据的家，
      # 丢了要重建（虽然能再从 ./data/novelforge.db 重搬一次）。
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelforge -d novelforge"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # 默认不把 PG 端口暴露到宿主机：只有同一个 compose 网络里的应用要连它。
    # 想用 psql / 图形客户端连进去看数，取消下面两行的注释（用 5433 避开宿主机上
    # 可能已有的 PG）。
    # ports:
    #   - "5433:5432"

  novel_dl_convert:
    image: ghcr.io/735876214/novel_dl_convert:latest
    container_name: novel_dl_convert
    restart: unless-stopped
    working_dir: /app
    # 可改：missing ＝ 镜像已在本地就不再联网检查，NAS 断网 / ghcr.io 访问受限时照样能启动；
    # 改成 always ＝ 每次 up 都去 registry 追最新镜像（那时 `docker compose up -d` 即等于更新）。
    pull_policy: missing

    ports:
      # 可改：左边＝NAS 上对外端口（与系统占用端口冲突时改这里）；右边＝容器内固定 8000，别动
      - "8992:8000"

    volumes:
      # 可改：左边是宿主机路径（要换位置就改这里），右边是容器内固定路径，别动
      # —— 输入 / 成品（两者物理分离，切勿指向同一个目录）——
      - ./input:/app/input
      - ./output:/app/output
      # —— 配置：config.yaml / settings.json / sources / logs / backups / fonts 都在这一层下 ——
      - ./config:/app/config
      # —— 书源登录态、AI 分章缓存：刻意与 config 平级，便于单独备份 / 迁移 ——
      - ./cookies:/app/config/cookies
      - ./cache:/app/config/cache
      # —— 阅读进度 / 批注 / 账号 / 书库登记 ——
      # 第 62 期起这里是**双份**的：切到 PG 之后 ./data 里那份 SQLite 只是「老库」，
      # 首次搬迁时被读一次、之后不再写（见下面的 NOVELFORGE_DB）。**不要删它** ——
      # 它是回滚唯一的路。
      - ./data:/app/data
      # —— 书库来源根（就地引用，只扫描、不搬文件）——
      # 需要第二个来源根：取消下面一行的注释，并在 environment 里同时打开 LIBRARY_SOURCE_DIRS2*
      - ./libraries:/app/libraries
      # - ./libraries2:/app/libraries2

    environment:
      # 可改：时区（日志时间 / 热力图按天聚合都会用到）
      - TZ=Asia/Shanghai

      # ———— 后端（第 62 期）：pg = 用上面的 postgres 容器；注释掉 = 回到 SQLite ————
      # 首次切过来时，服务端会自动把 ./data/novelforge.db 整库搬进 PG（幂等、只搬一次、
      # 原文件不动），搬完在「活动日志」里会有一条 `migrate` 记录。搬迁没成功就**不会**
      # 写标记、服务也会带着明确的报错启动失败 —— 不会出现「界面空的，其实是没连上」。
      #
      # 回滚：把下面两行注释掉，`docker compose up -d`。老 SQLite 一直是全的，
      # 直接就能回去（切过去之后在 PG 里产生的增量会丢，这点要有数）。
      - NOVELFORGE_DB=pg
      - NOVELFORGE_PG_DSN=postgresql://novelforge:novelforge@postgres:5432/novelforge
      # 表建在哪个 schema 里（默认 public，一般不用改）
      # - NOVELFORGE_PG_SCHEMA=public
      # ⚠️ 别打开下面这个：它会让本进程把「schema 整个删掉重建」当成正常操作，
      #    那是测试用例级隔离用的开关（见 novelforge/core/pg.py）。
      # - NOVELFORGE_PG_RESET=1

      # ———— 目录：容器内路径，一般无需改动；要换位置请改上面的 volumes ————
      - INPUT_DIR=/app/input
      - OUTPUT_DIR=/app/output
      - CONFIG_DIR=/app/config
      - COOKIE_DIR=/app/config/cookies
      - CACHE_DIR=/app/config/cache
      - LOG_DIR=/app/config/logs
      - DATA_DIR=/app/data

      # ———— 书库来源根：序号从 1 连续，遇到首个缺号即停 ————
      - LIBRARY_SOURCE_DIRS1=/app/libraries
      # 想给来源根起个界面显示名就取消注释（留空／注释掉＝取路径最后一级，即 libraries）
      # - LIBRARY_SOURCE_DIRS1_NAME=主库
      # - LIBRARY_SOURCE_DIRS2=/app/libraries2
      # - LIBRARY_SOURCE_DIRS2_NAME=备份根

      # ———— 可改：登录账号。**仅首次启动**（账号尚不存在时）写入 SQLite ————
      # 之后请在界面「设置 → 账户」里改，改完这里的 AUTH_PIN 不再生效；
      # 但 AUTH_SECRET 每次启动都会用到 —— 改过密码后请勿改动它，否则已登录的端全被踢下线。
      - AUTH_USER=admin
      - AUTH_PIN=changeme
      - AUTH_SECRET=change-this-to-a-long-random-string

      # ———— 目录自动监听：往 input 里丢文件即自动转换；只想手动触发就填 false ————
      - AUTO_WATCH=true
      # 轮询间隔（秒）。NAS 上 input 多为 SMB / NFS 挂载，建议 >= 3
      - WATCH_INTERVAL=5

      # ———— 可选：MOBI / AZW3 派生需要 Calibre 的 ebook-convert ————
      # 镜像默认不含它；注释掉／留空时，输出格式为 mobi / azw3 的任务自动降级为 EPUB（日志写明原因）
      # - EBOOK_CONVERT_BIN=/usr/bin/ebook-convert

      # ———— 可选：容器要走代理才能访问书源 / 在线元数据时（Clash 类跑在 NAS 主机上）————
      # host.docker.internal 需要 Docker 20.10+，老引擎请改填 NAS 的局域网 IP
      # - HTTP_PROXY=http://host.docker.internal:7890
      # - HTTPS_PROXY=http://host.docker.internal:7890
      # - NO_PROXY=localhost,127.0.0.1

      # ⚠️ AI 分章兜底（LLM）**不走环境变量**，请在「设置 → 转换 → 分章」页或
      #    config.yaml 的 llm 段（api_key / base_url / model）里配置。

    # 可选：以指定 UID/GID 运行，避免挂载目录里落下一堆 root 属主文件（群晖常见 1026:100）。
    # 不写这一行＝按镜像默认的 root 运行。⚠️ 填非 root 时，上面那些宿主机目录的属主必须匹配，
    # 否则容器写不进去（启动即报权限错）。
    # user: "1026:100"

    # 等 PG 真的能接受连接再起应用：不等的话启动那一刻必然连不上（容器起来了、
    # PG 还在 initdb），`db.init()` 会带着报错失败、容器重启一轮，日志里留一串
    # 「连不上」的噪音 —— 明明什么都没坏。
    depends_on:
      postgres:
        condition: service_healthy

    # 镜像已含源码与依赖；start.sh 只做一次依赖自检再 exec uvicorn（幂等、秒级）
    command: ["sh", "/app/start.sh"]

    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
