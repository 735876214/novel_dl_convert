# NovelForge — NAS / 容器部署（拉取预构建镜像，源码 + 依赖已烤进镜像）
#
# 镜像 ghcr.io/735876214/novel_dl_convert:latest 由 GitHub Actions 在每次推送 main 时自动构建发布，
# 源码与全部 Python 依赖已在「构建镜像时」烤进镜像，因此 NAS 端：
#   - 不要求本地 build
#   - 容器启动时不再 git clone 源码（告别之前 2~4 分钟的部署后等待）
#   - 只需 docker compose up -d 一条命令，自动从 ghcr.io 拉取镜像并运行
#
# 挂载仅保留「数据 / 配置」目录，源码来自镜像本身：
#   ./input     输入源文件（不存在自动创建）
#   ./output    导出成品
#   ./config    配置目录（./config/config.yaml；留空则应用回退内置默认）
#   ./cookies   书源登录态持久化（跨重启保留）
#   ./cache     AI 分章结果缓存
#
# 用法：在 docker-compose.yml 所在目录执行  docker compose up -d
# 更新：docker compose pull && docker compose up -d

services:
  novel_dl_convert:
    image: ghcr.io/735876214/novel_dl_convert:latest
    container_name: novel_dl_convert
    restart: unless-stopped
    working_dir: /app
    pull_policy: always
    ports:
      - "8992:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
      - ./cookies:/app/config/cookies
      - ./cache:/app/config/cache
      # 阅读端持久化：SQLite（阅读进度 / 批注 / 账号），跨重启与多端共享
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - INPUT_DIR=/app/input
      - OUTPUT_DIR=/app/output
      - CONFIG_DIR=/app/config
      - COOKIE_DIR=/app/config/cookies
      - CACHE_DIR=/app/config/cache
      - LOG_DIR=/app/config/logs
      - DATA_DIR=/app/data
      # 阅读端单用户轻登录（仅首次启动初始化；之后在「设置 → 账户」改，生产务必改默认值）
      - AUTH_USER=admin
      - AUTH_PIN=changeme
      - AUTH_SECRET=change-this-to-a-long-random-string
      # 可选：MOBI / AZW3 派生所需的 Calibre ebook-convert 路径
      # （缺失时对应任务自动降级为 EPUB，日志会说明原因）
      # - EBOOK_CONVERT_BIN=/usr/bin/ebook-convert
      # 目录自动监听（默认开）：input 里的 txt 自动转 EPUB，非 txt 原样导出
      # - AUTO_WATCH=true
      # - WATCH_INTERVAL=5
      # 可选：AI 分章兜底（不填则不联网）
      # - LLM_API_KEY=
      # - LLM_BASE_URL=https://api.openai.com/v1
      # - LLM_MODEL=gpt-4o-mini
    # 镜像已含源码与依赖，直接以 start.sh 幂等启动（依赖已装则跳过安装、秒级拉起）
    command: ["sh", "/app/start.sh"]
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
