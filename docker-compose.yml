# NovelForge — NAS / 容器部署（免 build，直接使用官方 Python 镜像）
#
# ⚠️ 不强制本地 build：基于官方 python:3.12-slim 镜像，把整个项目挂载到 /app，
#    容器启动时自动安装依赖（apt + pip）并拉起服务。
#    适合部署平台 / NAS 拿不到 Dockerfile、或不想本地构建镜像的环境。
#
# 目录职责严格分离：输入源文件、导出成品、配置/cookie/缓存各自独立挂载。
#
# 用法（在 docker-compose.yml 所在目录内执行）：
#   mkdir -p input output cookies cache
#   docker compose up -d
#
# 注：首次启动会 apt-get + pip install（约 1~2 分钟），之后只要容器不重建就无需重装。
services:
  novel_dl_convert:
    image: python:3.12-slim
    container_name: novel_dl_convert
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      # 整个项目源码挂载进 /app（含 novelforge/、requirements.txt、config.yaml）
      - ./:/app
      # ① 输入目录：待转换的 txt / 电子书源文件
      - ./input:/app/input
      # ② 导出目录：生成的 epub 等成品写到这里（与输入物理隔离）
      - ./output:/app/output
      # ③ 配置：config.yaml 只读挂载（改了需重启容器生效）
      - ./config.yaml:/app/config/config.yaml:ro
      # ④ Cookie 持久化：各书源登录态落盘，跨重启保留（下载功能用）
      - ./cookies:/app/config/cookies
      # ⑤ AI 分章缓存：按文本哈希缓存 LLM 结果，重复文件不二次计费
      - ./cache:/app/config/cache
    environment:
      - TZ=Asia/Shanghai
      - INPUT_DIR=/app/input
      - OUTPUT_DIR=/app/output
      - CONFIG_DIR=/app/config
      - COOKIE_DIR=/app/config/cookies
      - CACHE_DIR=/app/config/cache
      # 可选：AI 分章兜底（不填则不联网）
      # - LLM_API_KEY=
      # - LLM_BASE_URL=https://api.openai.com/v1
      # - LLM_MODEL=gpt-4o-mini
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends nodejs curl &&
             rm -rf /var/lib/apt/lists/* &&
             pip install --no-cache-dir -r /app/requirements.txt &&
             uvicorn novelforge.server:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
