# 转换行为配置（目录路径由环境变量 INPUT_DIR / OUTPUT_DIR / CONFIG_DIR 控制，见 docker-compose.yml）

chapter_detection:
  mode: hybrid            # regex | ai | hybrid（hybrid=正则+缩进优先，疑难再调 AI）
  context_lines: 3        # AI 核验时每条候选前后取的上下文行数
  fallback: regex         # AI 失败时的降级策略

traditionalize: false     # true=繁体转简体（opencc）

# 输入目录自动监听：扔进 input 的文件自动处理，成品落 output，全程写活动日志
watcher:
  enabled: true           # 服务启动时自动监听（环境变量 AUTO_WATCH=false 可临时关闭）
  interval: 5             # 轮询间隔（秒）；NAS 网络挂载建议 >=3s
  recursive: false        # true=连子目录一起监听
  settle_seconds: 1       # 文件写入稳定判定的单次等待
  stable_rounds: 2        # 连续 N 次大小不变才认为上传完成
  copy_non_txt: true      # 非 txt 文件原样导出到 output（记为「添加」）
  process_existing: true  # 启动时处理 input 里已有的存量文件
  max_retries: 3          # 单个文件失败重试上限，超过记一次失败并跳过
  ignore:                 # 忽略规则（fnmatch，针对文件名）
    - ".*"                # 隐藏文件
    - "*.tmp"
    - "*.part"
    - "*.crdownload"
    - "*.meta.json"       # 下载功能生成的 sidecar
    - "*.log"

# 活动日志（时间 / 文件名 / 操作 / 成功或失败）
logging:
  dir: ""                 # 留空=用环境变量 LOG_DIR（默认 /app/config/logs）
  max_entries: 2000       # 接口读取的内存缓冲条数（落盘不受限）

output:
  format: epub            # epub；mobi/azw3 需本机安装 Calibre 的 ebook-convert

download:
  enabled: false          # 默认关闭，仅公版源可用；设为 true 才开放搜索/下载
  public_only: true       # true=只放行 public 书源（如 Gutenberg）；false=允许全部已注册源

network:
  cookie_dir: /app/config/cookies   # 各书源 Cookie 持久化目录（容器内建议挂载）
  host_replace: {}                  # 应对 CDN 漂移：{"old-host": "new-host"}
  max_retries: 3                    # 传输/超时错误重试次数

# 可选：hybrid/ai 模式下 AI 分章兜底。填入 api_key 后，正则零命中/低命中时才会调 AI
# 支持任意 OpenAI 兼容端点（含本地 Ollama：base_url=http://host:11434/v1）
llm:
  api_key: ""
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
