# 转换行为配置（目录路径由环境变量 INPUT_DIR / OUTPUT_DIR / CONFIG_DIR 控制，见 .env.example）

chapter_detection:
  mode: hybrid            # regex | ai | hybrid（hybrid=正则+缩进优先，疑难再调 AI）
  context_lines: 3        # AI 核验时每条候选前后取的上下文行数
  fallback: regex         # AI 失败时的降级策略

traditionalize: false     # true=繁体转简体（opencc）

output:
  format: epub            # epub；mobi/azw3 需本机安装 Calibre 的 ebook-convert

download:
  enabled: false          # 默认关闭，仅公版源可用
  public_only: true

# 可选：hybrid 模式下 AI 分章兜底。留空则仅用正则+缩进降级（不联网、不花钱）
