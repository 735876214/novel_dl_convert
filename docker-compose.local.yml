# NovelForge — 本地「测试版」：复用已拉取的 ghcr 生产镜像，挂载本地源码覆盖。
#
# 与 docker-compose.dev.yml 的区别：不重新 build（绕开基础镜像/代理问题），
# 直接拿预构建镜像 + 把宿主机 novelforge/ 挂进容器，等价于 dev 容器但秒级启动。
# 前端用的是镜像里已构建好的版本（非本地 npm 重新构建）。
#
# 访问：http://localhost:8993   （生产版在 8992）
# 更新 Python 源码后：docker compose -f docker-compose.local.yml restart
# 停止：docker compose -f docker-compose.local.yml down

services:
  novelforge-local:
    image: ghcr.io/735876214/novel_dl_convert:latest
    container_name: novelforge-local
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8993:8000"
    volumes:
      # 源码挂载：Python 改动 restart 容器即生效
      - ./novelforge:/app/novelforge
      # 仓库根目录 config.yaml 映射到容器实际读取路径
      - ./config.yaml:/app/config/config.yaml:ro
      # 数据目录，与生产版保持一致
      - ./input:/app/input
      - ./output:/app/output
      - ./cookies:/app/config/cookies
      - ./cache:/app/config/cache
      # 阅读端持久化：SQLite（阅读进度 / 批注 / 账号）
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - INPUT_DIR=/app/input
      - OUTPUT_DIR=/app/output
      - CONFIG_DIR=/app/config
      - COOKIE_DIR=/app/config/cookies
      - CACHE_DIR=/app/config/cache
      - LOG_DIR=/app/config/logs
      - DATA_DIR=/app/data
      - AUTH_USER=admin
      - AUTH_PIN=changeme
      - AUTH_SECRET=change-this-to-a-long-random-string
      # 可选：MOBI / AZW3 派生所需的 Calibre ebook-convert 路径
      # - EBOOK_CONVERT_BIN=/usr/bin/ebook-convert
    command: ["sh", "/app/start.sh"]
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
